server.port=${APP_PORT:8082}
spring.datasource.url=${APP_DATASOURCE_URL:jdbc:h2:file:./appdb;DB_CLOSE_ON_EXIT=FALSE}
spring.datasource.username=${APP_DB_USER:sa}
spring.datasource.password=${APP_DB_PASSWORD:}
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.flyway.enabled=true
management.endpoints.web.exposure.include=health,info
app.bootstrap.tenant=${APP_BOOTSTRAP_TENANT:}
app.bootstrap.username=${APP_BOOTSTRAP_USERNAME:}
app.bootstrap.password=${APP_BOOTSTRAP_PASSWORD:}
